name: Update NFL odds and projections

on:
  schedule:
    - cron: "7 * * * *"   # hourly check; odds are only pulled ~24h before a kickoff window
  workflow_dispatch:
    inputs:
      force:
        description: "Pull odds now regardless of kickoff timing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nfl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - name: Run update
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python update.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Commit results
        run: |
          git config user.name "nfl-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update odds and projections" && git push)
