name: Update NFL odds, scanner and tracker

on:
  schedule:
    - cron: "7 * * * *"   # hourly check; odds are only pulled when a scan, model refresh or closing line is due
  workflow_dispatch:
    inputs:
      force:
        description: "Pull odds and rebuild everything now"
        type: boolean
        default: false
  push:
    paths:
      - "data/bets.csv"     # re-grade the tracker as soon as you log a bet

permissions:
  contents: write
  issues: write

concurrency:
  group: nfl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - name: Run update
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SCAN_EVERY_HOURS: ${{ vars.SCAN_EVERY_HOURS }}
        run: python update.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Phone alert for new +EV lines
        if: hashFiles('data/alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "+EV lines $(TZ=America/New_York date '+%a %b %-d %-I:%M %p')" --body-file data/alert.md
          rm data/alert.md
      - name: Commit results
        run: |
          git config user.name "nfl-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update odds, scan and tracker" && git pull --rebase && git push)
